version = 1

[[components]]
kind = "observability"
enabled = true

[components.config]
version = 3

[components.config.atof]
enabled = true

[[components.config.atof.sinks]]
type = "file"
output_directory = "/sandbox/hermes-flywheel-traces/replace-me/atof"
filename = "events.jsonl"
mode = "append"

[components.config.atif]
enabled = true
output_directory = "/sandbox/hermes-flywheel-traces/replace-me/atif"
filename_template = "trajectory-{session_id}.json"
agent_name = "Hermes-enterprise-world"
agent_version = "replace-me"
