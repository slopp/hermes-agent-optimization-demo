# Merge this into the Hermes profile's config.yaml after replacing
# /ABSOLUTE/PATH/TO/hermes-agent-optimization-demo with this directory.
#
# The mock server is started by Hermes as a stdio MCP subprocess. It intentionally
# has no credentials and is local-only.
mcp_servers:
  pa_style_enterprise:
    command: python3
    args: ["-m", "pa_style_mock_mcp.mcp_stdio"]
    env:
      PYTHONPATH: /ABSOLUTE/PATH/TO/hermes-agent-optimization-demo/src
      # The initial fidelity collection uses a broader, fully fixture-backed
      # catalog. Set to focused for narrow tool-contract debugging.
      PA_STYLE_TOOL_CATALOG: extended
    connect_timeout: 20
    timeout: 60

# Enable this only after the local Hermes/Relay installation has been configured.
# The exact Relay endpoint and export settings are intentionally environment-owned;
# do not add credentials or an enterprise endpoint to this repository.
# plugins:
#   enabled:
#     - observability/nemo_relay
