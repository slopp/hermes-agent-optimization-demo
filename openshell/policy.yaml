version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /opt, /etc, /var/log]
  read_write: [/workspace, /tmp, /dev/null]
landlock:
  compatibility: best_effort

# Model access is contributed by the attached hermes-nvidia provider. The base
# policy intentionally grants no other network destination.
network_policies: {}
