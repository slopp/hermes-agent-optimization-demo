# Portable copy of Trace Analyst output from the scored OpenShell baseline.
# A stable ID was added and generated absolute links were made repository-relative;
# the finding text and trace references are otherwise unchanged.
- id: TA-001
  name: Agent fails to invoke required tools specified by evaluators
  description: >-
    Across 5 of 6 evaluation traces, the agent consistently fails to call tools
    that evaluators require (actions.prepare_message, files.read_json,
    files.search, chat.read_thread, chat.search, connectors.get_status,
    calendar.list_events). In 4 of these traces, this directly correlates with
    missing factual content in final answers (security evidence packet,
    ava.patel@example.test, one business day, date variants, needs_auth) that the
    required tools would have retrieved. The agent instead produces answers by
    writing files, running scripts, or asking for clarification without using the
    mandated tools. This suggests a systemic prompt or planning misalignment where
    the agent does not recognize when specific tools are required.
